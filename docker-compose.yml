version: '3.9'

services:
  app:
    container_name: egystay-backend-live
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis://redis:6379
    depends_on:
      - redis
    restart: always
    networks:
      - egystay_network

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - egystay_network

  nginx:
    image: nginx:alpine
    container_name: egystay-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: always
    networks:
      - egystay_network

volumes:
  redis_data:

networks:
  egystay_network:
    driver: bridge
