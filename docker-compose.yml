version: '3.9'

services:
  app:
    container_name: backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
    restart: always
    networks:
      - docstation_network

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - docstation_network

volumes:
  redis_data:

networks:
  docstation_network:
    driver: bridge
