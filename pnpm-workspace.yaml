packages:
  - packages/*
  - services/*

catalogs:
  # Database & ORM
  database:
    "@prisma/client": "^7.2.0"
    "@prisma/adapter-pg": "^7.2.0"
    "@prisma/adapter-neon": "^7.2.0"
    "@prisma/extension-accelerate": "^3.0.1"
    "pg": "^8.16.3"
    "@types/pg": "^8.16.0"
    "prisma": "^7.2.0"
    "@neondatabase/serverless": "^1.0.2"

  # Core Express & Security
  core:
    "express": "^5.2.1"
    "cors": "^2.8.5"
    "helmet": "^8.1.0"
    "express-rate-limit": "^8.2.1"
    "express-useragent": "^2.0.2"
    "cookie-parser": "^1.4.7"
    "morgan": "^1.10.1"
    "@types/express": "^5.0.6"
    "@types/cors": "^2.8.19"
    "@types/helmet": "^4.0.0"
    "@types/express-rate-limit": "^6.0.2"
    "@types/express-useragent": "^1.0.5"
    "@types/cookie-parser": "^1.4.10"
    "@types/morgan": "^1.9.10"

  # Authentication & Encryption
  auth:
    "bcrypt": "^6.0.0"
    "jsonwebtoken": "^9.0.3"
    "crypto-js": "^4.2.0"
    "@types/bcrypt": "^6.0.0"
    "@types/jsonwebtoken": "^9.0.10"
    "@types/crypto-js": "^4.2.2"

  # File Handling & Storage
  storage:
    "multer": "^2.0.2"
    "sharp": "^0.34.5"
    "fs-extra": "^11.3.3"
    "cloudinary": "^2.6.1"
    "@types/multer": "^2.0.0"
    "@types/fs-extra": "^11.0.4"

  # Email Services
  email:
    "nodemailer": "^7.0.13"
    "@sendgrid/mail": "^8.1.6"
    "@types/nodemailer": "^7.0.9"

  # Cache & Queue
  cache:
    "redis": "^5.10.0"
    "bullmq": "^5.66.4"
    "node-cron": "^4.2.1"

  # WebSocket & Real-time
  websocket:
    "ws": "^8.19.0"
    "socket.io": "^4.8.3"
    "@types/ws": "^8.18.1"

  # API Documentation
  documentation:
    "swagger-ui-express": "^5.0.1"
    "swagger-jsdoc": "^6.2.8"
    "@types/swagger-jsdoc": "^6.0.4"
    "@types/swagger-ui-express": "^4.1.8"
    "hviz": "^1.3.8"

  # Utilities
  utilities:
    "axios": "^1.13.2"
    "uuid": "^13.0.0"
    "dotenv": "^17.2.3"
    "class-validator": "^0.14.3"
    "@types/axios": "^0.14.4"
    "@types/uuid": "^11.0.0"
    "@types/dotenv": "^8.2.3"

  # Development Tools
  dev:
    "typescript": "^5.9.3"
    "ts-node": "^10.9.2"
    "nodemon": "^3.1.11"
    "concurrently": "^9.2.1"
    "@types/node": "^25.0.3"
    "@types/concurrently": "^7.0.3"
    "@mohamed-elrefai/tsconfigs": "^1.0.2"
