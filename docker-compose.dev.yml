services:
  app:
    image: node:22
    container_name: doc-station-backend-dev
    working_dir: /app
    env_file:
      - .env
    environment:
      NODE_ENV: development
      REDIS_HOST: redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    ports:
      - "9000:9000"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
