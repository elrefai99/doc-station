apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-station-backend
  namespace: doc-station
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doc-station-backend
  template:
    metadata:
      labels:
        app: doc-station-backend
    spec:
      containers:
        - name: backend
          image: doc-station-backend:latest
          ports:
            - containerPort: 9000

          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: doc-station-backend-config
                  key: NODE_ENV

            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: doc-station-backend-config
                  key: REDIS_HOST
